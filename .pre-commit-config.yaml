---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=auto]
  # No pretty-format-json hook: it expands every array one element per line,
  # which Prettier (JSON_PRETTIER in .mega-linter.yml) collapses straight back.
  # Two autofixers reverting each other fail every run. Prettier owns JSON
  # style here because it is the one that runs in CI.

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: [-c, .markdownlint.json, --fix]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: ["-shellcheck="]

  # Workflow security audit. MegaLinter never sees .github/workflows here
  # (FILTER_REGEX_EXCLUDE in .mega-linter.yml), so this hook — run by the
  # pre-commit job in test.yml — is the only place zizmor runs in CI.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
