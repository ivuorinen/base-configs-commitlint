---
# zizmor configuration: https://docs.zizmor.sh/configuration/
rules:
  adhoc-packages:
    # Node 25+ no longer bundles corepack, so these workflows install it
    # globally on those runtimes; the version is pinned and install scripts
    # are disabled, and no lockfile applies to a global tool.
    ignore:
      - pr-lint.yml
      - publish.yml
      - test.yml
