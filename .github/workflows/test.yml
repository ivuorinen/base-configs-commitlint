---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deny-by-default at the workflow level; the job grants only what it needs.
permissions: {}

jobs:
  test:
    name: Resolve entry points
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read # required to checkout the repository

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js Environment
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"

      # The resolution test loads the package by its own name via self-reference
      # and has no third-party dependencies, so no install step is required.
      - name: Run tests
        shell: bash
        run: node --test
