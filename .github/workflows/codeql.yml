---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "22 8 * * 0"
  merge_group:

# Deny-by-default at the workflow level; the job grants only what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read # required to read workflow run metadata in private repos
      contents: read # required to checkout the repository
      packages: read # required to fetch internal or private CodeQL packs
      security-events: write # required to upload CodeQL analysis results
    strategy:
      fail-fast: false
      matrix:
        language: ["actions", "javascript"]
    steps:
      - name: CodeQL Analysis
        uses: ivuorinen/actions/codeql-analysis@94a4f68a6b95ecc1677fbcac1683119fd869adf7 # v2026.07.04
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality
