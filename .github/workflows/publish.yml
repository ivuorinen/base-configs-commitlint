---
name: Publish

on:
  push:
    branches:
      - main

# Releases must not be cancelled mid-run, so disable cancel-in-progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Deny-by-default at the workflow level; each job grants only what it needs.
permissions: {}

jobs:
  Linter:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      statuses: write # required to report the lint status
      contents: read # required to checkout the repository
      packages: read # required to read packages metadata
      issues: write # required for the linter to comment on issues
      pull-requests: write # required to comment on pull requests

    steps:
      - name: Run PR Lint
        # https://github.com/ivuorinen/actions
        uses: ivuorinen/actions/pr-lint@94a4f68a6b95ecc1677fbcac1683119fd869adf7 # v2026.07.04

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - Linter
    # Dedicated environment scopes access to the PAT secret.
    environment: release
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js Environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # No auth token: npm authenticates to the registry via OIDC Trusted
          # Publishing (requires a trusted publisher configured on npmjs.com).
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          scope: "@ivuorinen"

      - name: Enable corepack
        shell: sh
        # Use the Corepack bundled with the .nvmrc Node version instead of
        # installing a floating copy from npm in this privileged release job.
        run: corepack enable

      - name: Cache Node Modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/yarn.lock') }}

      - name: Install Dependencies
        shell: bash
        if: steps.cache.outputs.cache-hit != 'true'
        run: yarn install

      - name: Run tests
        shell: bash
        run: node --test

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          # No NPM_TOKEN: @semantic-release/npm publishes via OIDC Trusted
          # Publishing using the id-token: write permission above.
          GITHUB_TOKEN: ${{ secrets.PAT }}
