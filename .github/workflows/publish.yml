---
name: Publish

on:
  push:
    branches:
      - main

# Releases must not be cancelled mid-run, so disable cancel-in-progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Deny-by-default at the workflow level; each job grants only what it needs.
permissions: {}

jobs:
  Linter:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This workflow triggers on push only, so there is no pull request or
    # issue for the linter to comment on — no write scope for either.
    permissions:
      contents: read # required by the action's own checkout step
      statuses: write # required to report the lint status on the pushed commit
      packages: read # required to read packages metadata

    steps:
      - name: Run PR Lint
        # https://github.com/ivuorinen/actions
        uses: ivuorinen/actions/pr-lint@94a4f68a6b95ecc1677fbcac1683119fd869adf7 # v2026.07.04

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - Linter
    # Dedicated environment scopes access to the PAT secret.
    environment: release
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js Environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # No auth token: npm authenticates to the registry via OIDC Trusted
          # Publishing (requires a trusted publisher configured on npmjs.com).
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          scope: "@ivuorinen"

      - name: Enable corepack
        shell: bash
        # Node 25 dropped the bundled Corepack and .nvmrc is past that, so this
        # release job has none of its own. Runner images currently supply one,
        # but that is an undocumented side effect being removed upstream, and a
        # publish must not rest on it. The copy installed here is version-pinned
        # — the original objection was to a floating install, not a pinned one.
        run: |
          if [ "$(node -p 'parseInt(process.versions.node, 10)')" -ge 25 ]; then
            npm install -g --ignore-scripts corepack@0.35.0
          fi
          corepack enable

      - name: Cache Node Modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        # .nvmrc moves independently of yarn.lock, so both are in the key: a
        # Node bump starts from a fresh tree.
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', '**/yarn.lock') }}

      - name: Install Dependencies
        shell: bash
        # --mode=skip-build for the same reason as the test workflow, and more
        # so here: this job holds the PAT and npm publish rights, so it is the
        # worst place to let 400+ dependencies run install scripts. Packages are
        # still linked, which is all that @ivuorinen/semantic-release-config
        # needs to resolve from .releaserc.json.
        #
        # Unconditional and --immutable: gating it on a cache miss released
        # from the restored node_modules unchecked, which is how
        # base-configs-stylelint 1.4.0 was cut by stale rules. Against a
        # restored tree --immutable relinks rather than refetches.
        run: yarn install --immutable --mode=skip-build

      - name: Run tests
        shell: bash
        run: node --test

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        env:
          # No NPM_TOKEN: @semantic-release/npm publishes via OIDC Trusted
          # Publishing using the id-token: write permission above.
          GITHUB_TOKEN: ${{ secrets.PAT }}
